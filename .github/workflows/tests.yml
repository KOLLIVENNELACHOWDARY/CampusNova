name: tests
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: campusnova_test }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-retries=20
    env:
      SECRET_KEY: ci-secret-key-0123456789abcdef-long
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/campusnova_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: migrations round trip on MySQL
        env: { DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/campusnova_test" }
        run: |
          python -c "from sqlalchemy import create_engine,text;e=create_engine('$DATABASE_URL');c=e.connect();c.execute(text('DROP DATABASE campusnova_test'));c.execute(text('CREATE DATABASE campusnova_test'))" || true
          alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
